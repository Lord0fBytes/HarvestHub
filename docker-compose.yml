services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: harvesthub
      POSTGRES_USER: harvesthub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    container_name: harvesthub-postgres

  harvesthub:
    image: ${HARVESTHUB_IMAGE:-ghcr.io/lord0fbytes/harvesthub:1.2.1}
    ports:
      - "3100:3000"
    environment:
      DATABASE_URL: postgresql://harvesthub:${POSTGRES_PASSWORD}@postgres:5432/harvesthub
    depends_on:
      - postgres
    restart: unless-stopped
    container_name: harvesthub

volumes:
  postgres_data:
