name: Publish container image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag to build and publish
        required: true
        type: string

env:
  REGISTRY: gitea.massedonia.com
  IMAGE_NAME: lordofbytes/harvesthub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Resolve release version
        id: version
        env:
          TAG: ${{ gitea.event.release.tag_name || inputs.tag }}
        run: |
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Require Gitea registry token
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          if [ -z "$REGISTRY_TOKEN" ]; then
            echo "Set the REGISTRY_TOKEN Actions secret with package write access." >&2
            exit 1
          fi

      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.version.outputs.tag }}

      - name: Log in to Gitea Container Registry
        uses: docker/login-action@65b78e6e13532edd9afa3aa52ac7964289d1a9c1
        with:
          registry: ${{ env.REGISTRY }}
          username: lordofbytes
          password: ${{ secrets.REGISTRY_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
